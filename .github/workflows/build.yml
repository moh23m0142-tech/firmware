name: Build Bruce Firmware
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U platformio
      - run: pio run -e esp32-s3-devkitc-1-nokia-nokia
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: Bruce-esp32-s3-devkitc-1-nokia-nokia.bin
